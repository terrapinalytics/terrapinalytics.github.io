name: Check recruiting and finance sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-dashboard-sources.yml
      - scripts/check-dashboard-sources.py
  schedule:
    - cron: '23 10 * * 1'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for releases and data requiring review
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/check-dashboard-sources.py
