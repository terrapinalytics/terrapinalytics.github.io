name: Import the published football snapshot

on:
  push:
    branches: [main]
    paths: [scripts/football-migration.sha256]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify the published snapshot
        run: |
          target=assets/football-success
          origin=https://maryland-football-success-rates.jubilantzebra3.chatgpt.site
          while read -r digest path; do
            path=${path#./}
            mkdir -p "$target/$(dirname "$path")"
            curl --retry 3 --fail --silent --show-error --location "$origin/$path" --output "$target/$path"
          done < scripts/football-migration.sha256
          (cd "$target" && sha256sum --check ../../scripts/football-migration.sha256)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m "Import verified Big Ten football dashboard snapshot"
          git push origin HEAD:main
