project:
  type: website
  render:
    - "**/*.qmd"
    - "assets/**/*.md"
  resources:
    - styles.css
    - assets/peer-context.js
    - assets/view-tools.js
    - assets/tool-frame.js
    - assets/dashboard-mobile.css
    - assets/dashboard-mobile.js
    - assets/peer-context.css
    - assets/peer-context-methodology.md
    - assets/recruiting/**
    - assets/coaching/**
    - assets/championships/**
    - assets/finance/**
    - assets/articles/**
    - assets/fouls/**
    - assets/basketball-live/**
    - assets/football-success/**
    - assets/home/**
    - assets/menu-categories.js
    - assets/table-sort.js
    - assets/table-sort.css
    - assets/team-logos.js
    - assets/team-logos/**

website:
  title: "Terrapinalytics"
  description: "College sports research, data visualizations, and dashboards."
  site-url: "https://terrapinalytics.github.io/"
  favicon: assets/shell-network-white.png
  search: true
  navbar:
    background: "#15191e"
    foreground: "#ffffff"
    logo: assets/shell-network-white.png
    logo-alt: "Terrapinalytics shell"
    title: "Terrapinalytics"
    left:
      - href: index.qmd
        text: Home
      - text: Explore
        menu:
          - text: All dashboards
            href: projects/index.qmd
          - text: Football
          - href: projects/football-success.qmd
          - href: projects/coaching.qmd
          - href: projects/program-rankings.qmd
          - href: projects/recruiting.qmd
          - text: Basketball
          - href: projects/officiating.qmd
          - href: projects/maryland-basketball-live.qmd
          - text: College Athletics
          - href: projects/finance.qmd
          - href: projects/championships.qmd
          - href: projects/athletics-spending-index.qmd
          - href: projects/student-athletics-costs.qmd
      - text: Articles
        menu:
          - text: All articles
            href: articles/index.qmd
          - text: Football
          - href: articles/down-14-two-point-conversions.qmd
          - href: articles/recruiting-distance.qmd
          - text: College Athletics
          - href: articles/college-athletics-spending-index.qmd
          - href: articles/mandatory-athletics-fees.qmd
          - text: Site
          - href: articles/welcome.qmd
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/terrapinalytics
        aria-label: GitHub
  page-footer:
    left: "Terrapinalytics"
    right: ""

format:
  html:
    theme: cosmo
    css: assets/site.css
    include-after-body:
      - text: <script src="/assets/menu-categories.js?v=home-links1" defer></script>
    toc: true
    link-external-newwindow: true

execute:
  freeze: auto
